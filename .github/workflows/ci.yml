name: Build and verify Daily Connect

on:
  push:
    branches:
      - main
      - feature/ai-masterplan-native-navigation
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install reproducibly from lockfile
        run: |
          for attempt in 1 2 3; do
            if npm ci --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=15000 --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency installation failed after three attempts." >&2
              exit 1
            fi
            echo "npm registry connection interrupted, retrying install ($attempt/3)..."
            sleep 5
          done
      - name: Typecheck
        run: npm run typecheck
      - name: Vercel production build
        run: npm run build
      - name: App and deployment tests (excluding legacy Grok PWA injector tests)
        run: npm run test:deploy
      - name: Check Nitro Vercel build output
        run: |
          test -f .vercel/output/config.json
          test -d .vercel/output/functions
          test -d .vercel/output/static
          node -e 'const f=require("./.vercel/output/config.json"); if (typeof f.version !== "number") process.exit(1); console.log("Vercel output format:",f.version)'
